name: iOS release

# Builds the signed IPA, uploads it to App Store Connect and submits the
# version for App Review. Runs when a GitHub release is published (the same
# release that carries the Android APKs), or by hand. See docs/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's New (Spanish). Empty uses 'Mejoras y correcciones.'"
        required: false
      submit:
        description: Submit for App Review after uploading
        type: boolean
        default: true
      dry_run:
        description: Only build the IPA and check the API key; upload nothing
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-store:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      FASTLANE_DISABLE_COLORS: 1
      FASTLANE_SKIP_UPDATE_CHECK: 1
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version: *//')
          name=${full%%+*}
          if [[ -n "$TAG" && "$TAG" != "v$name" ]]; then
            echo "::error::Release tag $TAG does not match pubspec version v$name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=${full##*+}" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Install signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          kc_pass=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pass" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$kc_pass" "$RUNNER_TEMP/release.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$RUNNER_TEMP/release.keychain-db" -P "$P12_PASSWORD" \
            -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_pass" "$RUNNER_TEMP/release.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain
          rm "$RUNNER_TEMP/dist.p12"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$uuid.mobileprovision"
          done
          security find-identity -v -p codesigning "$RUNNER_TEMP/release.keychain-db"

      - name: Build IPA
        run: |
          xcodebuild -version
          flutter pub get
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          ruby -rjson -rbase64 -e 'File.write(ARGV[0], JSON.dump(
            key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"],
            key: Base64.decode64(ENV["ASC_KEY_P8_BASE64"]), in_house: false))' \
            "$RUNNER_TEMP/asc_api_key.json"

      - name: Check build number against App Store Connect
        env:
          BUILD: ${{ steps.version.outputs.build }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          # Read-only call, so it also proves the API key works.
          latest=$(fastlane run latest_testflight_build_number \
            api_key_path:"$RUNNER_TEMP/asc_api_key.json" app_identifier:ar.lawallet.pos \
            initial_build_number:0 | sed -n 's/.*Result: \([0-9][0-9]*\).*/\1/p' | tail -1)
          [[ -n "$latest" ]] || { echo "::error::Could not read builds from App Store Connect"; exit 1; }
          echo "Latest uploaded build: $latest, this build: $BUILD"
          if (( BUILD <= latest )) && [[ "$DRY_RUN" != true ]]; then
            echo "::error::Build number $BUILD is already used. Bump the +N in pubspec.yaml above $latest."
            exit 1
          fi

      - name: Write release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          notes="${RELEASE_BODY:-$INPUT_NOTES}"
          notes="${notes:-Mejoras y correcciones.}"
          mkdir -p "$RUNNER_TEMP/metadata/es-MX"
          # Plain text for the App Store: drop markdown headings, bold, code and links.
          printf '%s\n' "$notes" \
            | sed -E 's/^#+ *//; s/\*\*//g; s/`//g; s/\[([^]]*)\]\([^)]*\)/\1/g' \
            | head -c 4000 | iconv -c -f UTF-8 -t UTF-8 > "$RUNNER_TEMP/metadata/es-MX/release_notes.txt"
          cat "$RUNNER_TEMP/metadata/es-MX/release_notes.txt"

      - name: Upload and submit for review
        if: ${{ !inputs.dry_run }}
        env:
          SUBMIT: ${{ github.event_name == 'release' || inputs.submit }}
        run: |
          # Uploads the IPA, creates the App Store version if needed, sets
          # What's New, waits for processing, attaches the build and submits.
          # Only release_notes.txt is in metadata_path, so the rest of the
          # listing (description, screenshots, URLs) is left as it is.
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier ar.lawallet.pos \
            --platform ios \
            --ipa "build/ios/ipa/LaWallet POS.ipa" \
            --app_version "${{ steps.version.outputs.name }}" \
            --metadata_path "$RUNNER_TEMP/metadata" \
            --skip_screenshots true \
            --submit_for_review "$SUBMIT" \
            --automatic_release true \
            --submission_information '{"add_id_info_uses_idfa": false}' \
            --run_precheck_before_submit false \
            --force true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
